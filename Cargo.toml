[package]
name = "aeternitas"
version = "0.1.0"
description = "CLI time managment app"
authors = ["Mikhail Goloto <mikhail@goloto.dev>"]
license = "MIT"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
dirs = "6.0.0"
ratatui = "0.30.0"
rusqlite = { version = "0.40.1", features = ["backup", "modern_sqlite"] }

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
