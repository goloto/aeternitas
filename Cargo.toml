[package]
name = "aeternitas"
version = "0.1.0"
description = "CLI time managment app"
authors = ["Mikhail Goloto <mikhail@goloto.dev>"]
license = "MIT"
edition = "2024"

[dependencies]
chrono = "0.4.44"
crossterm = "0.29.0"
ratatui = "0.30.0"
rusqlite = "0.39.0"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
